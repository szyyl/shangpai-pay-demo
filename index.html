<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商拍 APP | 交互式付费流程演练 Demo</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="glow-bg"></div>
  
  <div class="container">
    <!-- Left Panel: Control Dashboard -->
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span>商拍 APP Demo</span>
        </div>
        <p class="tagline">付费转化流向与交互沙盒</p>
      </header>

      <!-- Section 1: Flowchart Map -->
      <section class="section">
        <h3 class="section-title">付费用流向路径图</h3>
        <div class="flowchart">
          <!-- Step 1 -->
          <div class="flow-node active" id="node-entry" onclick="navigateTo('entry')">
            <div class="node-icon">1</div>
            <div class="node-content">
              <span class="node-label">入口触发点</span>
              <span class="node-desc">额度耗尽 / 个人中心</span>
            </div>
            <span class="node-status-dot"></span>
          </div>

          <!-- Step 2 -->
          <div class="flow-node" id="node-pricing" onclick="navigateTo('pricing')">
            <div class="node-icon">2</div>
            <div class="node-content">
              <span class="node-label">权益与定价选择</span>
              <span class="node-desc">订阅制周/月 vs 算力包充值</span>
            </div>
            <span class="node-status-dot"></span>
          </div>

          <!-- Step 3 -->
          <div class="flow-node" id="node-checkout" onclick="navigateTo('checkout')">
            <div class="node-icon">3</div>
            <div class="node-content">
              <span class="node-label">收银台支付</span>
              <span class="node-desc">支付渠道与凭证确认</span>
            </div>
            <span class="node-status-dot"></span>
          </div>

          <!-- Step 4 -->
          <div class="flow-node" id="node-success" onclick="navigateTo('success')">
            <div class="node-icon">4</div>
            <div class="node-content">
              <span class="node-label">支付成功页</span>
              <span class="node-desc">订单生成与退款说明</span>
            </div>
            <span class="node-status-dot"></span>
          </div>
        </div>
      </section>

      <!-- Section 2: Sandbox Configurator -->
      <section class="section config-section">
        <h3 class="section-title">交互沙盒配置</h3>
        
        <div class="config-group">
          <label class="config-label">模拟入口场景</label>
          <div class="toggle-group">
            <button class="toggle-btn active" id="config-entry-quota" onclick="setEntryScenario('quota')">额度用尽提示</button>
            <button class="toggle-btn" id="config-entry-profile" onclick="setEntryScenario('profile')">个人中心入口</button>
          </div>
        </div>

        <div class="config-group">
          <label class="config-label">默认计费展示</label>
          <div class="toggle-group">
            <button class="toggle-btn active" id="config-mode-sub" onclick="setPricingMode('subscription')">订阅制 (周/月)</button>
            <button class="toggle-btn" id="config-mode-token" onclick="setPricingMode('token')">算力包消耗制</button>
          </div>
        </div>

        <div class="config-group">
          <label class="config-label">重置用户状态</label>
          <button class="btn btn-secondary" onclick="resetUserVIPState()">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
            </svg>
            重置为免费账号
          </button>
        </div>
      </section>

      <footer class="sidebar-footer">
        <div class="system-logs">
          <div class="log-title">事件日志</div>
          <div class="log-body" id="log-body">
            <div class="log-item">[系统] 沙盒已初始化。等待用户交互...</div>
          </div>
        </div>
      </footer>
    </aside>

    <!-- Right Panel: Phone Simulator -->
    <main class="simulator-wrapper">
      <div class="phone-mockup">
        <!-- Bezel parts -->
        <div class="phone-speaker"></div>
        <div class="phone-island">
          <div class="camera"></div>
          <div class="island-pill"></div>
        </div>
        
        <!-- Screen Area -->
        <div class="phone-screen">
          <!-- Status Bar -->
          <div class="status-bar">
            <span class="status-time" id="status-time">20:47</span>
            <div class="status-icons">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" style="opacity:0.8;"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.07 19.57 10.48 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
              <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" style="opacity:0.8; margin-left: 4px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
              <span class="status-battery" style="font-size: 10px; font-weight: 600; margin-left: 4px;">100%</span>
              <div class="battery-icon" style="width: 16px; height: 9px; border: 1px solid currentColor; border-radius: 2px; margin-left: 4px; position: relative;">
                <div style="position: absolute; top: 1px; left: 1px; bottom: 1px; right: 1px; background: currentColor; border-radius: 1px;"></div>
              </div>
            </div>
          </div>

          <!-- App Views Container (dynamic content loaded via JS) -->
          <div class="app-container" id="app-container">
            <!-- Rendered pages will be dynamically swapped here -->
          </div>

          <!-- Home Indicator -->
          <div class="home-indicator"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
